plugins {
    alias libs.plugins.android.library
    alias libs.plugins.jetbrains.kotlin.android
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
}

android {
    namespace 'com.thestudypath.pdf'
    compileSdkVersion "android-36.1"

    defaultConfig {
        minSdk 31
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    buildFeatures {
        buildConfig true
    }
    lint {
        targetSdk 36
    }
}

dependencies {
    implementation project(':core')

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    
    // PDF Library
    implementation libs.pdf.viewer.fragment
    implementation libs.pdf.ink

    // pdf-ink alpha19 still resolves Ink 1.0.0, whose V33 renderer can close
    // while a queued draw is pending. Keep the Ink family aligned on the
    // lifecycle-fixed release.
    def inkVersion = libs.versions.ink.get()
    implementation "androidx.ink:ink-authoring:$inkVersion"
    implementation "androidx.ink:ink-brush:$inkVersion"
    implementation "androidx.ink:ink-geometry:$inkVersion"
    implementation "androidx.ink:ink-strokes:$inkVersion"

    //Legacy Pdf library
    implementation libs.androidpdfviewer


    // Coroutines
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android

    // Lifecycle
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.runtime.ktx

    // Ads
    
    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics

    coreLibraryDesugaring libs.desugar.jdk.libs
}

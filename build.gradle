// Applied by id, not by catalog alias: the hosts name their plugin aliases differently. Each host
// puts both plugins on the build classpath in its root build file (`apply false`).
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// The View-based PdfActivity draws its toolbar with resources from the old app's :core module.
// A host without :core (studypath-mobile) builds the Compose reader, PdfActivityCompose, alone.
def hasCore = findProject(':core') != null
def catalog = extensions.getByType(VersionCatalogsExtension).named('libs')

android {
    namespace 'com.thestudypath.pdf'
    compileSdk 37

    defaultConfig {
        minSdk 31
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    sourceSets {
        main {
            if (hasCore) {
                java.srcDirs += 'src/views/java'
                kotlin.srcDirs += 'src/views/java'
                res.srcDirs += 'src/views/res'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    lint {
        targetSdk 37
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material

    // PDF Library
    implementation libs.pdf.viewer.fragment
    implementation libs.pdf.ink

    // pdf-ink beta01 still resolves Ink 1.0.0, whose V33 renderer can close
    // while a queued draw is pending. Keep the Ink family aligned on the
    // lifecycle-fixed release.
    def inkVersion = libs.versions.ink.get()
    implementation "androidx.ink:ink-authoring:$inkVersion"
    implementation "androidx.ink:ink-brush:$inkVersion"
    implementation "androidx.ink:ink-geometry:$inkVersion"
    implementation "androidx.ink:ink-strokes:$inkVersion"

    //Legacy Pdf library
    implementation libs.androidpdfviewer

    // Compose: the reader's bars, sheets and messages (PdfActivityCompose)
    implementation libs.compose.ui
    implementation libs.compose.foundation
    implementation libs.compose.material3
    implementation libs.androidx.activity.compose

    // Coroutines
    implementation libs.kotlinx.coroutines.core

    // Lifecycle
    implementation libs.lifecycle.runtime.ktx

    if (hasCore) {
        // What only PdfActivity (src/views) needs.
        implementation project(':core')
        implementation libs.constraintlayout
        implementation libs.kotlinx.coroutines.android
        implementation libs.lifecycle.viewmodel.ktx
        implementation libs.lifecycle.livedata.ktx

        // Firebase
        catalog.findLibrary('firebase-bom').ifPresent { implementation platform(it) }
        catalog.findLibrary('firebase-analytics').ifPresent { implementation it }
    }

    coreLibraryDesugaring libs.desugar.jdk.libs
}
